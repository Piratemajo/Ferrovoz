name: build

# - push a main y pull requests: tests y jar con las 5 plataformas (no con cambios
#   solo en .md o docs/).
# - Etiqueta vX.Y.Z: además publica la release en este repo.
# - Manual: "todas", o "macos" para sacar solo los binarios de Mac.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:
    inputs:
      plataformas:
        description: "todas = jar universal; macos = solo los binarios de Mac (para tu jar local)"
        type: choice
        options: [todas, macos]
        default: todas

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # Plataformas de esta ejecución.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        run: |
          linux='{"os":"ubuntu-latest","platform":"linux-x86_64","lib":"libferrovoz.so","server_lib":"libferrovoz_server.so"}'
          all="$linux"',{"os":"windows-latest","platform":"windows-x86_64","lib":"ferrovoz.dll","server_lib":"ferrovoz_server.dll"}'
          all="$all"',{"os":"ubuntu-24.04-arm","platform":"linux-aarch64","lib":"libferrovoz.so","server_lib":"libferrovoz_server.so"}'
          all="$all"',{"os":"macos-latest","platform":"macos-aarch64","lib":"libferrovoz.dylib","server_lib":"libferrovoz_server.dylib"}'
          all="$all"',{"os":"macos-15-intel","platform":"macos-x86_64","lib":"libferrovoz.dylib","server_lib":"libferrovoz_server.dylib"}'
          mac='{"os":"macos-latest","platform":"macos-aarch64","lib":"libferrovoz.dylib","server_lib":"libferrovoz_server.dylib"}'
          mac="$mac"',{"os":"macos-15-intel","platform":"macos-x86_64","lib":"libferrovoz.dylib","server_lib":"libferrovoz_server.dylib"}'
          if [[ "${{ inputs.plataformas }}" == "macos" ]]; then
            echo "matrix={\"include\":[$mac]}" >> "$GITHUB_OUTPUT"; echo "Solo macOS"
          else
            echo "matrix={\"include\":[$all]}" >> "$GITHUB_OUTPUT"; echo "Todas las plataformas"
          fi

  # Compila y prueba el núcleo en cada plataforma.
  native:
    needs: plan
    timeout-minutes: 40
    strategy:
      # Que terminen las demás aunque falle una.
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Caché de dependencias.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - name: Dependencias de audio (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev cmake
      - name: Segunda IP de loopback (macOS solo trae 127.0.0.1)
        if: runner.os == 'macOS' && inputs.plataformas != 'macos'
        run: sudo ifconfig lo0 alias 127.0.0.2 up
      - name: Tests
        # Solo binarios de Mac: sin tests.
        if: inputs.plataformas != 'macos'
        working-directory: native
        run: cargo test
      - name: THIRD_PARTY_LICENSES al día
        if: matrix.platform == 'linux-x86_64'
        run: |
          python3 tools/third_party_licenses.py
          git diff --exit-code -- mod/src/main/resources/META-INF/THIRD_PARTY_LICENSES.txt \
            || (echo "Han cambiado las dependencias: ejecuta python3 tools/third_party_licenses.py y sube el archivo" && exit 1)
      - name: Release (cliente, con audio)
        working-directory: native
        run: cargo build --release
      - name: Release (servidor dedicado, sin audio)
        working-directory: native
        shell: bash
        run: |
          cargo build --release --no-default-features --target-dir target/server
          mkdir -p out
          cp target/release/${{ matrix.lib }} out/
          cp target/server/release/${{ matrix.lib }} out/${{ matrix.server_lib }}
      - name: Comprobar que la variante de servidor no depende de ALSA
        if: runner.os == 'Linux'
        working-directory: native
        run: |
          ldd out/${{ matrix.server_lib }}
          ! ldd out/${{ matrix.server_lib }} | grep -q asound
      # La API de Java para plugins, contra la librería que se acaba de compilar.
      - uses: actions/setup-java@v4
        if: matrix.platform == 'linux-x86_64'
        with:
          distribution: temurin
          java-version: 21
      - name: API de Java contra el núcleo
        if: matrix.platform == 'linux-x86_64'
        run: FERROVOZ_LIB="$PWD/native/out/${{ matrix.server_lib }}" bash tools/api_test.sh
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: native/out/*
      # Kit de benchmark (tools/bench) con el programa de los clientes para este sistema,
      # para lanzarlo en un servidor sin instalar Rust.
      # Desde native/, como los demás: ahí está .cargo/config.toml (política de CMake
      # para libopus y el Poly1305 rápido).
      - name: Kit de benchmark
        if: ${{ !startsWith(matrix.platform, 'macos') }}
        shell: bash
        working-directory: native
        run: |
          cargo build --release --no-default-features --example bench_clients --target-dir target/server
          mkdir -p ../bench-kit
          cp ../tools/bench/run-bench.bat ../tools/bench/run-bench.sh ../tools/bench/LEEME.md ../bench-kit/
          cp "target/server/release/examples/bench_clients${{ runner.os == 'Windows' && '.exe' || '' }}" ../bench-kit/
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(matrix.platform, 'macos') }}
        with:
          name: bench-clients-${{ matrix.platform }}
          path: bench-kit/

  # Solo macOS: zip con natives/ listo para descomprimir en mod/natives-prebuilt/.
  natives-mac:
    needs: native
    if: inputs.plataformas == 'macos'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - run: |
          for dir in artifacts/native-*; do
            platform="${dir#artifacts/native-}"
            mkdir -p "pack/natives/$platform"
            cp "$dir"/* "pack/natives/$platform/"
          done
          find pack
      - uses: actions/upload-artifact@v4
        with:
          name: natives-macos
          path: pack/

  # Jar con los binarios de todas las plataformas.
  mod:
    needs: native
    if: inputs.plataformas != 'macos'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Colocar binarios nativos
        run: |
          for dir in artifacts/native-*; do
            platform="${dir#artifacts/native-}"
            mkdir -p "mod/natives-prebuilt/natives/$platform"
            cp "$dir"/* "mod/natives-prebuilt/natives/$platform/"
          done
          find mod/natives-prebuilt
      - name: Compilar mod
        working-directory: mod
        run: |
          chmod +x gradlew
          ./gradlew build -PskipNative
      # Minecraft 1.21.1: Java 21 y los mismos binarios nativos (mod/natives-prebuilt).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Compilar mod (Minecraft 1.21.1)
        working-directory: mod-1.21.1
        run: |
          chmod +x gradlew
          ./gradlew build -PskipNative
          cp build/libs/*.jar ../mod/build/libs/
      - uses: actions/upload-artifact@v4
        with:
          name: ferrovoz-mod
          path: mod/build/libs/*.jar

  # Al subir una etiqueta vX.Y.Z publica la release en este repo con el jar y las
  # notas de CHANGELOG.md.
  release:
    needs: mod
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ferrovoz-mod
          path: jar
      - name: Comprobar versión y preparar archivos
        id: prep
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(grep '^mod_version=' mod/gradle.properties | cut -d= -f2)
          MC=$(grep '^minecraft_version=' mod/gradle.properties | cut -d= -f2)
          NAME="ferrovoz-$MC-$VERSION.jar"   # p. ej. ferrovoz-26.3-0.9.0.jar
          if [ "$TAG" != "$VERSION" ]; then
            echo "La etiqueta es v$TAG pero mod/gradle.properties dice $VERSION. Deben coincidir."; exit 1
          fi
          python3 tools/release_notes.py "$VERSION" > notes.md
          JAR=$(ls jar/*.jar | grep -v -- '-sources' | grep -- "ferrovoz-$MC-" | head -1)
          mkdir dist
          cp "$JAR" "dist/$NAME"
          # El jar tiene que llevar las 5 plataformas.
          for p in windows-x86_64 linux-x86_64 linux-aarch64 macos-aarch64 macos-x86_64; do
            unzip -l "dist/$NAME" | grep -q "natives/$p/" || { echo "Falta natives/$p en el jar"; exit 1; }
          done
          # Y los descriptores de Fabric, NeoForge, Forge, Paper/Spigot, Velocity y BungeeCord.
          for f in fabric.mod.json META-INF/neoforge.mods.toml META-INF/mods.toml plugin.yml pack.mcmeta velocity-plugin.json bungee.yml \
                   dev/ferrovoz/api/FerrovozApi.class; do
            unzip -l "dist/$NAME" | grep -q " $f\$" || { echo "Falta $f en el jar"; exit 1; }
          done
          # La API para otros mods y plugins, en su propio jar (vale para las dos versiones).
          for f in "ferrovoz-api-$VERSION.jar" "ferrovoz-api-$VERSION-sources.jar" "ferrovoz-api-$VERSION-javadoc.jar"; do
            cp "jar/$f" dist/ || { echo "Falta $f"; exit 1; }
          done
          # Minecraft 1.21.1: también un solo jar (Fabric, NeoForge, Forge, Paper y proxies).
          JAR_1211="ferrovoz-1.21.1-$VERSION.jar"
          cp "jar/$JAR_1211" dist/
          for f in fabric.mod.json META-INF/neoforge.mods.toml META-INF/mods.toml plugin.yml pack.mcmeta velocity-plugin.json bungee.yml \
                   dev/ferrovoz/FerrovozNative.class dev/ferrovoz/intermediary/fabric/FerrovozFabric.class dev/ferrovoz/neoforge/FerrovozNeoForge.class \
                   dev/ferrovoz/api/FerrovozApi.class dev/ferrovoz/intermediary/ApiCore.class; do
            unzip -l "dist/$JAR_1211" | grep -q " $f\$" || { echo "Falta $f en $JAR_1211"; exit 1; }
          done
          # La API no se reubica en la copia de Fabric: los demás mods la buscan en dev.ferrovoz.api.
          if unzip -l "dist/$JAR_1211" | grep -q "dev/ferrovoz/intermediary/api/"; then
            echo "La API está reubicada en $JAR_1211"; exit 1
          fi
          for p in windows-x86_64 linux-x86_64 linux-aarch64 macos-aarch64 macos-x86_64; do
            unzip -l "dist/$JAR_1211" | grep -q "natives/$p/" || { echo "Falta natives/$p en $JAR_1211"; exit 1; }
          done
          (cd dist && for f in *.jar; do sha256sum "$f" > "$f.sha256"; done)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # Versiones con guion (1.0.0-alpha, 0.8.0-beta.2...) son prerelease.
          case "$VERSION" in *-*) echo "pre=--prerelease" >> "$GITHUB_OUTPUT";; *) echo "pre=" >> "$GITHUB_OUTPUT";; esac
          ls -la dist; cat notes.md
      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ steps.prep.outputs.version }}
        run: |
          if gh release view "v$VERSION" --repo "$REPO" > /dev/null 2>&1; then
            echo "La release v$VERSION ya existe en $REPO: sube primero el número de versión."; exit 1
          fi
          gh release create "v$VERSION" dist/* --repo "$REPO" \
            --title "Ferrovoz $VERSION" --notes-file notes.md ${{ steps.prep.outputs.pre }}
          echo "Publicada: https://github.com/$REPO/releases/tag/v$VERSION" | tee -a "$GITHUB_STEP_SUMMARY"
