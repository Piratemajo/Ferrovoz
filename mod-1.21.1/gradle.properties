org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Ferrovoz para Minecraft 1.21.1. Se compila con Java 21 (ver README, "Minecraft 1.21.1").
# La versión del mod se lee de ../mod/gradle.properties: las dos versiones salen siempre a la vez.
minecraft_version=1.21.1
# https://fabricmc.net/develop/ (cualquier loader >= 0.16 vale para 1.21.1)
loader_version=0.16.14
loom_version=1.11-SNAPSHOT
# Si Gradle dice que no la encuentra, pon la última "+1.21.1" de https://fabricmc.net/develop/
fabric_api_version=0.116.7+1.21.1
# Permisos en Fabric 1.21.1 (los usa LuckPerms). Va dentro del jar.
fabric_permissions_api_version=0.3.1

# Paper/Spigot/Purpur 1.21.1
paper_api_version=1.21.1-R0.1-SNAPSHOT

# NeoForge 21.1 y Forge 52: solo se compila contra sus API (el + coge la última).
neoforge_version=21.1.+
neoforge_fml_version=4.0.+
neoforge_bus_version=8.0.+
neoforge_mergetool_version=2.0.0
forge_version=52.1.+
forge_eventbus_version=6.2.+
forge_mergetool_version=1.0

# Proxies: los mismos que en ../mod (no dependen de la versión de Minecraft).
velocity_api_version=4.3.+
bungeecord_api_version=26.1-R0.1-SNAPSHOT

maven_group=dev.ferrovoz
archives_base_name=ferrovoz
